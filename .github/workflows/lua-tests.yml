name: Lua module tests

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'luascripts/pappaliiga/**'
      - 'luascripts/stats/util/utils.lua'
      - 'luascripts/stats/gamelog.lua'
      - 'tests/**'
      - '.github/workflows/lua-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua5.4 lua-dkjson

      - name: Test PappaBalance
        run: lua5.1 tests/pappabalance_test.lua

      - name: Test competition config frame rates
        run: python3 tests/config_rates_test.py

      - name: Test PappaReady
        run: lua5.4 tests/pappaready_test.lua
      - name: Test highlight presence and match recording
        run: |
          lua5.4 tests/pappahighlights_test.lua
          lua5.4 tests/pappahighlights_recording_test.lua

      - name: Test stopwatch millisecond precision
        run: lua5.4 tests/stopwatch_precision_test.lua

      - name: Test opt-in broadcast telemetry and relay control
        run: |
          lua5.4 tests/pappabroadcast_test.lua
          lua5.4 tests/pappabroadcast_tv_test.lua
          lua5.4 tests/broadcast_objective_test.lua
